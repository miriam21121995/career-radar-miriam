 function addCountry(code){const v=GEO_COUNTRIES[code];if(!v)return;countries.add(code);regions.add(v[1]);}
 function addCity(v){const city=String(v||'').trim().replace(/^[\s-]+|[\s-]+$/g,'');if(city.length<2||city.length>85||noise.test(city))return;if(GEO_REGION_LOOKUP.has(geoNorm(city))||GEO_LOOKUP.has(geoNorm(city)))return;if(/^(?:\d+|[A-Z]{2}\s*\d+)$/.test(city))return;cities.add(city);const country=GEO_HINTS.get(geoNorm(city));if(country)addCountry(country);}
 for(const place of places){
   const fragment=place.replace(/^(?:remote|remoto|hybrid|ibrido|onsite|on-site|based in|location)\s*[:\-–]\s*/i,'').trim();
   if(!fragment||noise.test(fragment))continue;
   const area=GEO_REGION_LOOKUP.get(geoNorm(fragment));if(area){regions.add(area);continue;}
   const directCountry=GEO_LOOKUP.get(geoNorm(fragment));if(directCountry){addCountry(directCountry[0]);continue;}
   const bits=fragment.split(/\s*,\s*|\s+[-–]\s+/).map(x=>x.trim()).filter(Boolean);
   let mainCity='';
   for(let k=0;k<bits.length;k++){
     const part=bits[k];const n=geoNorm(part);
     if(GEO_REGION_LOOKUP.has(n)){regions.add(GEO_REGION_LOOKUP.get(n));continue;}
     if(GEO_STATE_CODES.has(part.toUpperCase())&&bits.length>1&&k>0){addCountry('US');continue;}
     const foundCountry=GEO_LOOKUP.get(n);
     if(foundCountry){addCountry(foundCountry[0]);continue;}
     if(/^(?:remote|remoto|hybrid|ibrido|on.site|onsite|multiple locations)$/i.test(part))continue;
     if(k===0)mainCity=part;
   }
   if(mainCity)addCity(mainCity);
 }
 // An ad marked 'Remote, Europe' is not evidence of a specific country or city.
 const result={countries:[...countries],regions:[...regions],cities:[...cities]};
 GEO_LOCATION_CACHE.set(key,result);return result;
}
function geoFacets(){
 const byRegion=new Set(),byCountry=new Set(),byCity=new Set();
 for(const job of allJobs()){
  const geo=geoOf(job);
  geo.regions.forEach(x=>byRegion.add(x));geo.countries.forEach(x=>byCountry.add(x));geo.cities.forEach(x=>byCity.add(x));
 }
 return {regions:GEO_REGIONS.filter(x=>byRegion.has(x)),countries:[...byCountry].sort((a,b)=>(GEO_COUNTRIES[a]?.[0]||a).localeCompare(GEO_COUNTRIES[b]?.[0]||b,'it')),cities:[...byCity].sort((a,b)=>a.localeCompare(b,'it'))};
}
function geoAvailableCountries(facets){return facets.countries.filter(code=>!filters.jobRegion.length||filters.jobRegion.includes(GEO_COUNTRIES[code]?.[1]));}
function geoAvailableCities(facets){
 if(!filters.jobRegion.length&&!filters.jobCountry.length)return facets.cities;
 const allowed=new Set();
 for(const j of allJobs()){
   const geo=geoOf(j);
   const regionOK=!filters.jobRegion.length||geo.regions.some(x=>filters.jobRegion.includes(x));
   const countryOK=!filters.jobCountry.length||geo.countries.some(x=>filters.jobCountry.includes(x));
   if(regionOK&&countryOK)geo.cities.forEach(c=>allowed.add(c));
 }
 return facets.cities.filter(x=>allowed.has(x));
}

function geoJobPass(j){

 if(!regions.length&&!countries.length&&!cities.length)return true;
 // Always keep fully remote opportunities; eligibility must be verified on official posting.
 if(isRemotePosition(j))return true;

 if(regions.length&&!geo.regions.some(x=>regions.includes(x)))return false;

let sourceAuditScope='all',sourceAuditSearch='';
function sourceAuditInfo(s){
 const explicit=String(s.lastResult||'unknown');
 const attempt=String(s.lastAttempt||'');
 const checked=String(s.lastChecked||'').trim();
 if(explicit==='error')return {id:'failed',label:'Ultimo controllo fallito',hint:s.errorText||'Errore di importazione registrato'};
 if(explicit==='success'){
  const parsed=Date.parse(attempt.replace(' ','T')+(attempt.endsWith('Z')?'':'Z'));
  const hours=Number.isFinite(parsed)?(Date.now()-parsed)/3600000:null;
  if(hours!==null&&hours>48)return {id:'stale',label:'Ultimo successo datato',hint:'Ultimo controllo riuscito oltre 48 ore fa'};
  if(Number(s.jobs)===0)return {id:'zero',label:'Riuscito · zero offerte',hint:'Import riuscito, nessun annuncio attivo'};
  return {id:'passed',label:'Import riuscito',hint:'Ultimo tentativo concluso correttamente'};
 }
 if(!checked)return {id:'never',label:'Mai controllata',hint:'Nessun controllo registrato'};
 const parsed=Date.parse(checked.replace(' ','T')+(checked.endsWith('Z')?'':'Z'));
 const hours=Number.isFinite(parsed)?(Date.now()-parsed)/3600000:null;
 if(hours!==null&&hours>48)return {id:'stale',label:'Dato storico',hint:'Data registrata, esito non ancora certificato'};
 if(Number(s.jobs)===0)return {id:'zero',label:'Zero offerte · esito N.D.',hint:'Nessun risultato attivo, esito non registrato'};
 return {id:'recent',label:'Esito da verificare',hint:'Fonte importata prima dell’introduzione della diagnostica'};
}

function v45URLIdentity(raw){
 try { const u=new URL(raw); const h=u.hostname.toLowerCase(),p=u.pathname.split('/').filter(Boolean);
  if(/greenhouse\.io$/.test(h))return 'greenhouse:'+String(p[0]||'').toLowerCase();
  if(h==='jobs.lever.co')return 'lever:'+String(p[0]||'').toLowerCase();
  if(h==='jobs.ashbyhq.com')return 'ashby:'+String(p[0]||'').toLowerCase();
  if(h==='careers.smartrecruiters.com')return 'smartrecruiters:'+String(p[0]||'').toLowerCase();
  if(h==='apply.workable.com')return 'workable:'+String(p[0]||'').toLowerCase();
  if(h.endsWith('.recruitee.com'))return 'recruitee:'+h.split('.')[0];
  if(h.endsWith('.teamtailor.com'))return 'teamtailor:'+h.split('.')[0];
  if(h.endsWith('.myworkdayjobs.com'))return 'workday:'+h+':'+String(p[0]||'').toLowerCase();
  return 'url:'+h+p.join('/').toLowerCase();
 } catch {return ''}
}
function v45RelatedSources(c){
 const own=v45SourceForCompany(c),url=c.careers_url||own[0]?.careers||'';
 const board=v45URLIdentity(url),group='';
 if(!board)return {board:'',same:[],possible:[]};
 const same=careerSources.filter(x=>v45URLIdentity(x.careers)===board&&nameKey(x.name)!==nameKey(c.name));
 // A shared Workday tenant can host separate sites; this is not proof of group ownership.
 let possible=[];
 if(board.startsWith('workday:')){
  const host=new URL(url).hostname.toLowerCase();
  possible=careerSources.filter(x=>{try{return nameKey(x.name)!==nameKey(c.name)&&new URL(x.careers).hostname.toLowerCase()===host&&v45URLIdentity(x.careers)!==board}catch{return false}});
 }
 return {board,same,possible};
}
function v45Why(c){
 const txt=String(c.sector||'')+' '+String(c.notes||'');
 return V45_FOCUS.filter(([,pattern])=>pattern.test(txt)).map(([, ,why])=>why).slice(0,2);
}
function v45Suggest(){
 const candidates=data.companies.filter(c=>!v45SourceForCompany(c).length&&!c.atsVerified);
 const weight=c=>(c.favorite?50:0)+(v45Why(c).length?20:0)+(c.url?3:0);
 // Stable rotation by calendar day: suggestions change without external scheduled jobs.
 const day=Math.floor(Date.now()/86400000);
 return candidates.sort((a,b)=>weight(b)-weight(a)||((nameKey(a.name).length+day)%17)-((nameKey(b.name).length+day)%17)||a.name.localeCompare(b.name)).slice(0,3);
}

function probeCompanyCareers(id){

 const existing=careerSources.find(s=>nameKey(s.name)===nameKey(c.name));
 const initial=c.careers_url||existing?.careers||'';
 const body=`<div class="note"><b>Controllo fonte Careers</b><p>Incolla l'indirizzo diretto della bacheca Greenhouse, Lever o Ashby. Career Radar verifica se il feed pubblico risponde, senza inviare il CV o salvare informazioni sul server. Per LinkedIn puoi usare soltanto un collegamento alla ricerca, senza importazione automatica.</p></div><div class="form-grid"><label class="full">URL della bacheca<input id="probe-board-url" type="url" value="${esc(initial)}" placeholder="https://jobs.ashbyhq.com/nomeazienda"></label></div><div id="probe-result" role="status" class="probe-result">Puoi verificare un feed e preparare l’attivazione sicura nel database Cloudflare. Nessuna password viene richiesta nell’app.</div>`;

   const url=document.getElementById('probe-board-url')?.value.trim()||'';
   const out=document.getElementById('probe-result');if(!out)return;
   if(!/^https:\/\//i.test(url)){out.textContent='Inserisci un URL HTTPS valido.';return;}
   out.textContent='Controllo del portale in corso…';
   try{
     const response=await fetch(API_BASE+'/api/ats-probe?url='+encodeURIComponent(url),{cache:'no-store'});
     const result=await response.json();
     if(!response.ok||!result.ok)throw Error(result.message||'Feed non disponibile');
     c.careers_url=result.careers;c.atsVerified={ats:result.ats,board:result.board,total:result.total,checkedAt:new Date().toISOString()};save();
     const sqlValue=v=>"'"+String(v||'').replaceAll("'","''")+"'";
     const sql='INSERT INTO companies (name,sector,location,website_url,careers_url,source_type,monitoring_status) VALUES ('+
       [c.name,c.sector||'Da classificare',c.location||'',c.url||result.careers,result.careers,result.ats,'active'].map(sqlValue).join(', ')+
       ") ON CONFLICT(name) DO UPDATE SET careers_url=excluded.careers_url, source_type=excluded.source_type, monitoring_status='active';";
     window.careerRegistrySQL=sql;
     out.innerHTML='<strong>✓ Feed '+esc(result.ats.toUpperCase())+' raggiungibile</strong><p>'+result.total+' offerte restituite.</p>'+
       (result.monitored?'<div class="note"><b>✓ Già nel monitoraggio automatico</b></div>':'<div class="note"><b>Da approvare su Cloudflare</b><p>Il feed è verificato ma non ancora monitorato. Copia la query SQL, apri Cloudflare → D1 → career-radar-db → Console ed eseguila. Al prossimo controllo programmato la fonte entrerà nella rotazione automaticamente, senza nuovi deploy.</p><button class="btn primary" type="button" onclick="copyCareerRegistrySQL()">Copia query di attivazione D1</button></div>')+
       (result.sample?.length?'<ul>'+result.sample.map(j=>'<li>'+esc(j.title)+' · '+esc(j.location)+'</li>').join('')+'</ul>':'<p>Nessun annuncio attualmente restituito.</p>');
     document.getElementById('modal-save').textContent='Ricontrolla';
   }catch(e){out.textContent='Verifica non riuscita: '+(e.message||String(e));}
 });
 document.getElementById('modal-save').textContent='Verifica feed';
}

// V26: local-only company coverage audit; public read-only ATS probe; explicit D1 approval.
const careerAuditUI={filter:'all',term:'',running:false,done:0,total:0,bulkProposals:[]};
function atsBoardFromURL(value){
  try{
    const u=new URL(value||'');
    if(u.protocol!=='https:'||u.username||u.password||u.port)return null;
    const host=u.hostname.toLowerCase(),piece=u.pathname.split('/').filter(Boolean)[0]||'';
    if(!/^[a-z0-9][a-z0-9_.-]{1,70}$/i.test(piece))return null;
    if(['job-boards.greenhouse.io','job-boards.eu.greenhouse.io','boards.greenhouse.io','boards.eu.greenhouse.io'].includes(host))return {ats:'greenhouse',board:piece,url:'https://'+host+'/'+piece};
    if(host==='jobs.lever.co')return {ats:'lever',board:piece,url:'https://'+host+'/'+piece};
    if(host==='jobs.ashbyhq.com')return {ats:'ashby',board:piece,url:'https://'+host+'/'+piece};
    if(host==='careers.smartrecruiters.com'||host==='jobs.smartrecruiters.com')return {ats:'smartrecruiters',board:piece,url:'https://careers.smartrecruiters.com/'+piece};
    if(/^([a-z0-9][a-z0-9-]{1,70})\.teamtailor\.com$/.test(host))return {ats:'teamtailor',board:host.split('.')[0],url:'https://'+host+'/jobs'};
    if(host==='apply.workable.com'&&piece)return {ats:'workable',board:piece,url:'https://apply.workable.com/'+piece+'/'};
    if(/^([a-z0-9][a-z0-9-]{1,70})\.recruitee\.com$/.test(host))return {ats:'recruitee',board:host.split('.')[0],url:'https://'+host+'/'};
    if(/^([a-z0-9][a-z0-9-]{1,62})\.wd[0-9]{1,3}\.myworkdayjobs\.com$/.test(host)){
      const tenant=host.split('.')[0];let parts=u.pathname.split('/').filter(Boolean);
      if(/^([a-z]{2})(-[a-z]{2})?$/i.test(parts[0]||''))parts=parts.slice(1);
      const site=parts[0]||'';
      if(/^[a-z0-9][a-z0-9_-]{0,100}$/i.test(site))return {ats:'workday',board:tenant+'-'+site,url:'https://'+host+'/'+site};
    }

    return null;
  }catch{return null}
}

function auditRecords(){
  const existing=new Map(careerSources.map(s=>[nameKey(s.name),s]));
  const existingBoards=new Map(careerSources.map(s=>[((s.ats||'greenhouse')+':'+(s.board||atsBoardFromURL(s.careers)?.board||'')).toLowerCase(),s]));
  return data.companies.map(c=>{
    const stored=(data.careerAudit||{})[nameKey(c.name)]||{};
    const url=c.careers_url||'';
    const direct=atsBoardFromURL(url)||atsBoardFromURL(c.url);
    const previous=Boolean(c.atsVerified&&direct&&c.atsVerified.ats===direct.ats&&c.atsVerified.board?.toLowerCase()===direct.board.toLowerCase());
    const row=previous&&!stored.verified?{url:direct.url,ats:direct.ats,board:direct.board,verified:true,found:c.atsVerified.total,checkedAt:c.atsVerified.checkedAt}:stored;
    const identity=direct||atsBoardFromURL(row.url);
    const configured=existing.get(nameKey(c.name))||(identity?existingBoards.get((identity.ats+':'+identity.board).toLowerCase()):null);
    const verified=Boolean(row.verified&&atsBoardFromURL(row.url));
    const status=configured?'monitored':verified?'verified':direct?'candidate':url?'other':'missing';
    return {c,row,configured,direct,status,url};
  });
}

// V37 — This audit measures watchlist coverage against approved source registry,
// NOT whether an individual company's last import succeeded.
let sectorCoverageFilter='';
function sectorCoverageRows(){
  const all=auditRecords();
  const groups=new Map();
  for(const record of all){
    const sector=String(record.c.sector||'Non classificato').trim()||'Non classificato';
    if(!groups.has(sector)) groups.set(sector,{sector,total:0,monitored:0,verified:0,unlinked:0});
    const g=groups.get(sector);g.total++;
    if(record.status==='monitored')g.monitored++;
    else if(record.status==='verified')g.verified++;
    else g.unlinked++;
  }
  return [...groups.values()].sort((a,b)=>b.unlinked-a.unlinked||a.sector.localeCompare(b.sector,'it'));
}

// exists, NOT that it belongs to the target company. Explicit review is mandatory.
// V42: transparent batch scanning; all attempted companies remain visible.
const LINK_DISCOVERY_CACHE_KEY='career_radar_discovery_v43';
const LINK_DISCOVERY_CACHE_AGE=14*24*60*60*1000;
function readLinkDiscoveryCache(){
 try{const a=JSON.parse(localStorage.getItem(LINK_DISCOVERY_CACHE_KEY)||'{}');return a&&typeof a==='object'?a:{}}catch{return {}}
}

function normalizedCompanyName(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'')}
function careersDomain(s){try{return new URL(s).hostname.toLowerCase().replace(/^www\./,'')}catch{return ''}}
function officialCareerRank(page, company){
 const url=String(page?.url||''),title=String(page?.title||''),host=careersDomain(url),website=careersDomain(company?.url||''),name=normalizedCompanyName(company?.name||''),text=(title+' '+url).toLowerCase();
 if(!/^https:\/\//i.test(url)||!host)return -100;
 if(/(^|\.)(linkedin\.com|tavily\.com|indeed\.com|glassdoor\.com|facebook\.com|instagram\.com|reddit\.com|google\.com|ziprecruiter\.com|monster\.com|simplyhired\.com)$/.test(host))return -100;
 let score=0;
 if(website&&(host===website||host.endsWith('.'+website)||website.endsWith('.'+host)))score+=110;
 if(name&&normalizedCompanyName(host).includes(name))score+=65;
 if(/career|join.us|work.with.us|job.offer|vacanc|open.position|opportunit|lavora.con.noi|join.our.team|view.jobs/i.test(text))score+=35;
 if(/\bcareers?\b|\bjobs?\b|work with us|join us|opportunit/i.test(title))score+=17;
 if(/\b(internship|assistant|analyst|coordinator|manager|engineer|consultant)\b/i.test(title))score-=38;
 if(/\/job[s]?\/[^/?#]{7,}|\/job-offers\/[^/?#]{7,}|\/positions\/[^/?#]{7,}/i.test(url))score-=35;
 if(/workdayjobs\.com|greenhouse\.io|lever\.co|ashbyhq\.com|smartrecruiters\.com|teamtailor\.com|workable\.com|recruitee\.com/.test(host))score+=20;
 return score;
}
function selectOfficialPages(raw,company){
 const distinct=[...new Map((raw||[]).filter(x=>httpsLink(x?.url)!=='#').map(x=>[String(x.url).replace(/\/$/,''),{url:x.url,title:x.title||x.url}])).values()];
 const ranked=distinct.map(p=>({...p,rank:officialCareerRank(p,company)})).sort((a,b)=>b.rank-a.rank);
 // Un motore di ricerca non costituisce prova di proprieta': etichetta come suggerimento.
 const recommended=ranked.find(p=>p.rank>=35)||null;
 return {recommended,others:ranked.filter(p=>p.url!==recommended?.url).slice(0,8)};
}

async function startLinkDiscovery(){
 if(linkDiscovery.running)return;
 const sector=document.getElementById('link-discovery-sector')?.value||'',key=sector||'__all__';
 const max=Math.min(15,Math.max(1,Number(document.getElementById('link-discovery-max')?.value)||10));
 const records=auditRecords().filter(r=>r.status!=='monitored'&&(!sector||String(r.c.sector||'Non classificato')===sector));
 if(!records.length){const p=document.getElementById('link-discovery-progress');if(p)p.textContent='Tutte le aziende di questo settore risultano già monitorate.';return}
 let start=Number(linkDiscovery.offsets[key]||0);
 if(start>=records.length){start=0;linkDiscovery.offsets[key]=0;linkDiscovery.results=[]}
 const batch=records.slice(start,start+max);linkDiscovery.offsets[key]=start+batch.length;
 linkDiscovery.running=true;const run=++linkDiscovery.runId;linkDiscovery.done=0;linkDiscovery.total=batch.length;linkDiscovery.sector=sector;linkDiscovery.cacheHits=0;
 linkDiscovery.results=batch.map(({c,status})=>({id:c.id,name:c.name,sector:c.sector,status:'checking',initialStatus:status,candidates:[],officialPages:[],searchState:'',attempts:0,error:'',website:c.url||'',cached:false}));
 const btn=document.getElementById('link-discovery-start');if(btn)btn.disabled=true;
 const p=document.getElementById('link-discovery-progress');if(p)p.textContent='Analizzo '+batch.length+' aziende · '+(start+1)+'–'+(start+batch.length)+' di '+records.length+'…';
 renderLinkDiscoveryResults();let cursor=0;
 async function worker(){
  while(linkDiscovery.running&&run===linkDiscovery.runId&&cursor<batch.length){
   const i=cursor++,item=linkDiscovery.results[i];if(!item)continue;
   const matching=auditRecords().find(x=>String(x.c.id)===String(item.id));
   if(matching?.status==='verified'){
    item.status='confirmed';item.candidates=[{url:matching.row.url,ats:matching.row.ats,board:matching.row.board,total:matching.row.found||0,sample:[],confirmed:true}];
   }else{
    const known=matching?.direct||atsBoardFromURL(matching?.url)||atsBoardFromURL(matching?.c?.careers_url);
    const candidates=[];const website=httpsLink(matching?.c?.url||'');
    const cache=readLinkDiscoveryCache(),cacheKey=linkDiscoveryCacheKey(item,website);
    const old=cache[cacheKey];
    const fresh=old&&Date.now()-Number(old.at||0)<LINK_DISCOVERY_CACHE_AGE;
    if(fresh&&Array.isArray(old.pages)){
      item.officialPages=old.pages;item.searchState=old.searchState||'searched';item.cached=true;linkDiscovery.cacheHits++;
    }
    try{
      const token=document.getElementById('link-search-secret')?.value||'';
      const query=new URLSearchParams({company:item.name});if(website!=='#')query.set('website',website);
      if(!fresh){
        const resp=await fetch(API_BASE+'/api/careers-web-search?'+query.toString(),{headers:token?{'Authorization':'Bearer '+token}:{},cache:'no-store',signal:AbortSignal.timeout(20000)});
        const info=await resp.json();
        item.officialPages=Array.isArray(info.results)?info.results.filter(x=>httpsLink(x.url)!=='#').slice(0,12):[];
        item.searchState=(!info.configured?'not_configured':resp.ok?'searched':resp.status===401?'unauthorized':'error');
        if(!resp.ok)item.error=String(info.message||'Ricerca web non riuscita');
        if(resp.ok&&item.searchState==='searched'){
          const latest=readLinkDiscoveryCache();latest[cacheKey]={at:Date.now(),pages:item.officialPages,searchState:item.searchState};
          // Limite di dimensione della cache: non influenzare la watchlist/CV.
          const keys=Object.keys(latest).sort((a,b)=>Number(latest[b].at||0)-Number(latest[a].at||0));
          for(const k of keys.slice(250))delete latest[k];
          saveLinkDiscoveryCache(latest);
        }
      }
    }catch(e){item.searchState='error';item.error='Ricerca web non riuscita: '+String(e.message||e).slice(0,80)}

    for(const url of urls){
     if(!linkDiscovery.running||run!==linkDiscovery.runId||candidates.length>=2)break;
     item.attempts++;
     try{
      const resp=await fetch(API_BASE+'/api/ats-probe?url='+encodeURIComponent(url),{cache:'no-store',signal:AbortSignal.timeout(9000)});
      if(!resp.ok)continue;const body=await resp.json();

    }

   }
   linkDiscovery.done++;if(p&&run===linkDiscovery.runId)p.textContent=linkDiscovery.done+'/'+batch.length+' aziende analizzate · '+(start+batch.length)+' di '+records.length+' nel settore · '+linkDiscovery.cacheHits+' risultati dalla cache';
   renderLinkDiscoveryResults();
  }
 }
 try{await Promise.all(Array.from({length:Math.min(2,batch.length)},worker))}finally{
  if(run===linkDiscovery.runId){linkDiscovery.running=false;const secret=document.getElementById('link-search-secret');if(secret)secret.value='';if(btn)btn.disabled=false;if(p)p.textContent+=' · Analisi terminata. Premi «Analizza prossime aziende» per continuare.';renderLinkDiscoveryResults()}
 }

// V28: explicit bulk URL onboarding. Local watchlist only; never writes to D1.
function parseBulkCareersInput(raw){
  const proposals=[],rejected=[],seen=new Set();
  const byName=new Map(data.companies.map(c=>[nameKey(c.name),c]));
  const lines=String(raw||'').split(/\r?\n/);
  if(lines.length>600){return {proposals:[],rejected:[{line:0,why:'Massimo 600 righe per importazione.'}]};}
  lines.forEach((line,i)=>{
    const t=line.trim();if(!t)return;
    const separator=t.includes('\t')?'\t':t.includes(';')?';':',';
    const at=t.indexOf(separator);
    if(at<0){rejected.push({line:i+1,why:'Manca il separatore (punto e virgola o tabulazione).'});return;}
    const name=t.slice(0,at).trim().replace(/^"|"$/g,'');
    const url=t.slice(at+1).trim().replace(/^"|"$/g,'');
    if(i===0&&/^(azienda|company|nome azienda|name)$/i.test(name))return;
    const c=byName.get(nameKey(name));
    if(!c){rejected.push({line:i+1,why:'Azienda non presente nella watchlist: '+name.slice(0,70)});return;}
    const spec=atsBoardFromURL(url);
    if(!spec){rejected.push({line:i+1,why:'URL non supportato per '+name.slice(0,70)});return;}
    if(seen.has(nameKey(c.name))){rejected.push({line:i+1,why:'Azienda ripetuta: '+name.slice(0,70)});return;}
    if(c.careers_url&&c.careers_url!==spec.url){
      rejected.push({line:i+1,why:'Link Careers già presente per '+name.slice(0,70)+' — modificalo singolarmente per evitare sovrascritture.'});return;
    }
    seen.add(nameKey(c.name));proposals.push({id:c.id,name:c.name,url:spec.url,ats:spec.ats,board:spec.board});
  });
  return {proposals,rejected};
}
function previewBulkCareers(){
  const el=document.getElementById('bulk-careers-result');if(!el)return;
  const raw=document.getElementById('bulk-careers-input')?.value||'';
  const {proposals,rejected}=parseBulkCareersInput(raw);
  careerAuditUI.bulkProposals=proposals;
  const btn=document.getElementById('bulk-apply');if(btn)btn.disabled=!proposals.length;
  el.innerHTML='<b>'+proposals.length+' link abbinati · '+rejected.length+' righe da correggere</b>'+

function applyBulkCareers(){
  const raw=document.getElementById('bulk-careers-input')?.value||'';
  const checked=parseBulkCareersInput(raw);
  const saved=careerAuditUI.bulkProposals;
  if(!saved.length||checked.proposals.length!==saved.length||saved.some((p,i)=>p.id!==checked.proposals[i].id||p.url!==checked.proposals[i].url)){
    alert('Hai modificato il testo dopo l’anteprima. Premi prima Controlla abbinamenti.');return;
  }
  if(!confirm('Salvare '+saved.length+' link Careers nella watchlist locale? NON saranno ancora monitorati: dovrai prima verificarli e approvarli in D1.'))return;
  let changed=0;
  for(const item of saved){
    const c=data.companies.find(c=>c.id===item.id);if(!c)continue;
    if(c.careers_url&&c.careers_url!==item.url)continue;
    c.careers_url=item.url;
    if(data.careerAudit)delete data.careerAudit[nameKey(c.name)];
    delete c.atsVerified;changed++;
  }
  save();careerAuditUI.bulkProposals=[];
  const btn=document.getElementById('bulk-apply');if(btn)btn.disabled=true;
  const el=document.getElementById('bulk-careers-result');if(el)el.innerHTML='<b>✓ '+changed+' link Careers salvati nella watchlist.</b><p>Ora premi «Verifica tutti i feed individuati», poi «Copia SQL per le fonti verificate». Nessuna fonte è stata attivata automaticamente.</p>';
  renderCareerAudit();
}

function cvTokens(text){const stop=new Set('the and for with from this that have will your our you are per con una uno delle degli della nella dello come che non sono alla delle azienda ruolo work working ability skills experience years ability strong excellent very role team teams client clients business financial manage management project projects support supporting responsibilities requirements requisiti richiesta aziendali attività delle degli delle più nel all delle delle dei sul sono essere il lo gli le un uno una di da in a e ed su tra è dei delle nel non or an to of on at as is be by we this you it'.split(/\s+/));return [...new Set((String(text||'').toLowerCase().match(/[a-zàèéìòù][a-zàèéìòù0-9+#-]{3,}/g)||[]).filter(x=>!stop.has(x)))];}
function plainJobDescription(raw){
 const src=String(raw||'');if(!src.includes('<'))return src;
 const doc=new DOMParser().parseFromString(src,'text/html');
 doc.querySelectorAll('script,style,template,svg,iframe').forEach(x=>x.remove());
 return (doc.body.innerText||doc.body.textContent||'').replace(/\s+/g,' ').trim();
}
function safeJobHTML(raw){
 const src=String(raw||'');if(!src.trim())return '';
 if(!/<[a-z][\s\S]*>/i.test(src))return `<p>${esc(src).replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>')}</p>`;
 const doc=new DOMParser().parseFromString(src,'text/html');
 const blocks=new Set(['p','div','section','article','h2','h3','h4','ul','ol','li','br','strong','b','em','i']);
 function serial(node){
  if(node.nodeType===3)return esc(node.textContent);
  if(node.nodeType!==1)return '';
  const tag=node.tagName.toLowerCase();
  if(['script','style','iframe','svg','object','template','form'].includes(tag))return '';
  const inside=Array.from(node.childNodes).map(serial).join('');
  return blocks.has(tag)?`<${tag}>${inside}</${tag}>`:inside;
 }
 return Array.from(doc.body.childNodes).map(serial).join('').slice(0,70000);
}

function fitAnalysis(j){
 const cv=plainJobDescription(data.cvDraft||'').trim();const jd=plainJobDescription(jobDescription(j)).trim();
 if(!cv)return {state:'missingCV',label:'Importa il CV master',message:'Importa prima il CV in CV Studio per avviare una verifica per competenze.'};
 if(jd.length<180)return {state:'missingJD',label:'Descrizione insufficiente',message:'Non sono presenti requisiti sufficienti per una verifica: controlla il sito Careers.'};
 const found=[],verify=[];
 for(const [name,jobPattern,cvPattern] of MATCH_TOPICS){if(jobPattern.test(jd)){
  (cvPattern.test(cv)?found:verify).push(name);
 }}
 if(found.length+verify.length<2)return {state:'limited',label:'Analisi non conclusiva',message:'La descrizione non contiene abbastanza segnali strutturati per un confronto attendibile.'};
 const level=found.length>=4?'Diverse aree coerenti':found.length>=2?'Alcune aree coerenti':'Poche aree riconosciute';
 return {state:'topics',label:level,found,verify,message:'Lettura preliminare per aree professionali e sinonimi. Un’area trovata nel CV non dimostra da sola il livello di esperienza richiesto; un’area non riconosciuta non significa che manchi davvero. Non è una valutazione AI né una previsione di assunzione.'};
}

function evidenceExcerpt(text,regex){let s=String(text||'').replace(/\s+/g,' ');const m=regex.exec(s);if(!m)return '';const begin=Math.max(0,m.index-55),end=Math.min(s.length,m.index+m[0].length+85);return (begin?'…':'')+s.slice(begin,end).trim()+(end<s.length?'…':'')}
function matchEvidence(j,category,inCV){const t=MATCH_TOPICS.find(x=>x[0]===category);if(!t)return '';return evidenceExcerpt(inCV?plainJobDescription(data.cvDraft):plainJobDescription(jobDescription(j)),inCV?t[2]:t[1]);}

 const internal=selectedDiscoveryCompanies();const sect=[...new Set(data.companies.map(c=>c.sector).filter(Boolean))].sort();

 `<div class="note"><b>Ricerca esterna sperimentale.</b> La modalità mercato interroga in tempo reale l'indice pubblico Wikidata: può scoprire imprese assenti dal catalogo, ma <b>non è un database completo del mercato</b>. I risultati vanno verificati: non sono necessariamente aziende operative, né includono dati affidabili su fatturato e reputazione. Nessun CV viene inviato.</div>`+
 `<section class="panel"><h2>${discoverScope==='watchlist'?'Esplora la watchlist':'Ricerca nuove aziende sul mercato'}</h2><div class="discovery-controls"><label>Parole chiave / tipo di società<input id="discover-keyword" value="${esc(discoverSearchTerm)}" placeholder="Es. commodity trading, fashion media, sports agency" onkeydown="if(event.key==='Enter')runDiscovery()"></label><label>Settore per catalogazione<select id="discover-sector" onchange="discoverSector=this.value;${discoverScope==='watchlist'?'renderDiscoverResults()':'void 0'}"><option value="">Qualsiasi settore</option>${sect.map(s=>`<option value="${esc(s)}" ${s===discoverSector?'selected':''}>${esc(s)}</option>`).join('')}</select></label><button class="btn primary" onclick="runDiscovery()">⌕ ${discoverScope==='watchlist'?'Filtra watchlist':'Cerca sul mercato'}</button></div>`+

function selectedDiscoveryCompanies(){let term=discoverSearchTerm.toLowerCase().trim();return data.companies.filter(c=>(!discoverSector||c.sector===discoverSector)&&(!term||(c.name+' '+c.sector+' '+c.location+' '+(c.notes||'')).toLowerCase().includes(term))).slice(0,90)}

 const newResults=discoverMarketResults;
 let external=newResults.length?`<div class="discovery-grid">${newResults.map(c=>`<article class="discovery-result-card"><div><span class="tiny muted">RISULTATO ESTERNO · WIKIDATA</span><h3>${esc(c.name)}</h3></div><p>${esc(c.description||'Descrizione non disponibile; verifica che sia un’azienda.')}</p><div class="discovery-unknown">Sede, dipendenti, fatturato e stato Careers: non verificati</div><div class="actions"><a class="btn" href="${esc(c.source)}" target="_blank" rel="noopener noreferrer">Verifica fonte ↗</a>${discoveredInList(c.name)?'<span class="pill">Già presente</span>':`<button class="btn primary" onclick="addDiscoveredCompany('${esc(c.id)}')">+ Aggiungi alla watchlist</button>`}</div></article>`).join('')}</div>`:'<div class="discovery-results-state">Nessun risultato esterno caricato. Inserisci parole chiave e premi «Cerca sul mercato». Alcune ricerche non hanno risultati nell’indice gratuito.</div>';

function renderDiscoverResults(){if(view==='companies'){refreshCompanies();return;}const x=document.getElementById('discovery-results');if(x)x.innerHTML=discoveryResultsMarkup();const meta=document.getElementById('discovery-meta');if(meta)meta.textContent=discoverScope==='watchlist'?selectedDiscoveryCompanies().length+' aziende nella watchlist':discoverMarketResults.length+' risultati esterni ricevuti · '+discoverMarketResults.filter(c=>!discoveredInList(c.name)).length+' non ancora nella watchlist'+(discoverFetchedAt?' · '+discoverFetchedAt:'')}
async function runDiscovery(){discoverSearchTerm=(document.getElementById('discover-keyword')?.value||'').trim().slice(0,90);discoverSector=document.getElementById('discover-sector')?.value||'';if(discoverScope==='watchlist'){filters.query=discoverSearchTerm;refreshCompanies();return}if(discoverSearchTerm.length<3){alert('Inserisci almeno 3 caratteri per cercare sul mercato.');return}
 discoverState='loading';refreshCompanies();try{const url=API_BASE+'/api/discover?query='+encodeURIComponent(discoverSearchTerm);const res=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(32000)});const body=await res.json();if(!res.ok||!body.ok)throw Error(body.message||'Fonte temporaneamente non accessibile');discoverMarketResults=(body.results||[]).filter(x=>x.id&&x.name&&/^https:\/\/www\.wikidata\.org\/wiki\/Q\d+$/.test(x.source)).slice(0,40);discoverState='ready';data.discoveryHistory=[discoverSearchTerm,...data.discoveryHistory.filter(x=>x!==discoverSearchTerm)].slice(0,8);save();discoverFetchedAt='Ultima ricerca: '+new Date().toLocaleTimeString('it-IT');}catch(e){discoverState='error';discoverError='Ricerca esterna non disponibile: '+(e.message||'errore di rete')+'. Verifica di aver aggiornato anche career-radar-api alla V7';}refreshCompanies();}

function marketSize(n){const v=Number(n);if(!Number.isFinite(v)||v<0)return '';return v<=50?'1–50':v<=200?'51–200':v<=1000?'201–1.000':v<=5000?'1.001–5.000':'Oltre 5.000'}
const MARKET_SECTOR_RULES=[
 ['Trading & Market Infrastructure',/trading firm|market mak|stock exchange|securities exchange|financial market|clearing|capital market|derivatives|brokerage|high.frequency|algorithmic trading/i],
 ['Private Equity & Investment',/private equity|investment fund|investment firm|asset management|investment company/i],
 ['Venture Capital & Startups',/venture capital|startup|start-up|accelerator|venture studio/i],
 ['Sport & Motorsport',/motorsport|formula one|sport(s|ing)? organization|sport(s|ing)? management|sports marketing/i],
 ['Live Events & Entertainment',/concert|event management|festival|entertainment|live event/i],
 ['Creative, PR & Brand Experience',/advertising|creative agency|public relations|brand experience|communication agency|marketing agency|design studio/i],
 ['Fashion & Luxury',/fashion house|luxury good|luxury brand|fashion brand|fashion design/i],
 ['Fashion Media & Publishing',/fashion magazine|fashion media|fashion publishing|fashion journalism|publishing company/i],
 ['Model & Talent',/model agency|talent agency|talent management|model management/i],
 ['Diamonds & Gemstones',/diamond|gemstone|gemological|jewelry trading/i],
 ['Art, Auctions & Collectibles',/auction house|art dealer|fine art|collectible/i],

 ['Agricultural Commodities',/agricultural commodity|grain trader|agricultural trading|food commodity/i],
 ['Environmental Commodities',/carbon trading|carbon credit|emissions trading|environmental markets/i]
];
function marketSectorHints(c){const txt=[c.name,c.description,c.industry,c.instanceOf].filter(Boolean).join(' ');return MARKET_SECTOR_RULES.filter(([,r])=>r.test(txt)).map(([s])=>s)}
function marketPass(c){
 const f=filters,known=discoveredInList(c.name),local=data.companies.find(x=>nameKey(x.name)===nameKey(c.name));

 const m=local?intelligence(local):{};
 const size=m.size||marketSize(c.employees);
 const country=c.country||'';
 const location=local?.location||country;
 const sector=local?.sector||c.sector||'';
 const text=(c.name+' '+(c.description||'')+' '+(c.industry||'')+' '+(country||'')).toLowerCase();
 // External search is already filtered server-side by keyword; text filter is a post-search refinement.
 const mapped=marketSectorHints(c); 
 const okSector=!f.companies.length || (sector&&f.companies.includes(sector)) || f.companies.some(s=>mapped.includes(s)) || (!mapped.length&&!sector&&f.companyUnknown);
 const okCity=!f.city.length||(location?multiContains(f.city,location):f.companyUnknown);
 const okMonitor=!f.monitor.length||f.monitor.some(x=>x==='Collegate'?!!local&&local.monitoring==='active':!local||local.monitoring!=='active');
 const okFav=!f.favorites.length||f.favorites.some(x=>x==='Preferite'?!!local&&local.favorite:!local||!local.favorite);
 const okSize=filterOptional(f.companySize,size,f.companyUnknown);
 const okGrowth=filterOptional(f.companyGrowth,m.growth,f.companyUnknown);
 const okRep=filterOptional(f.companyReputation,m.reputation,f.companyUnknown);
 const okPrestige=filterOptional(f.companyPrestige,m.prestige,f.companyUnknown);
 const revenue=m.revenue==null||m.revenue===''?null:Number(m.revenue);
 const okRevenue=!f.companyMinRevenue||(revenue===null?f.companyUnknown:revenue>=Number(f.companyMinRevenue)*1000000);
 const okJobs=!f.companyHasJobs||companyJobsCount(c.name)>0;
 return okSector&&okCity&&okMonitor&&okFav&&okSize&&okGrowth&&okRep&&okPrestige&&okRevenue&&okJobs;
}

function plainCVHtml(text){return text?'<p>'+esc(text).replace(/\n/g,'<br>')+'</p>':'';}
function sanitizeCVHtml(markup){
 const doc=new DOMParser().parseFromString('<div>'+String(markup||'')+'</div>','text/html');
 const approved=new Set(['P','BR','STRONG','B','EM','I','U','UL','OL','LI','H1','H2','H3','H4','TABLE','TBODY','THEAD','TR','TD','TH','BLOCKQUOTE','DIV','SPAN']);
 const dangerous=new Set(['SCRIPT','STYLE','SVG','IFRAME','OBJECT','EMBED','FORM','INPUT','BUTTON','IMG','LINK','META','AUDIO','VIDEO']);
 function clean(node){
  if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent||'');
  if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();
  if(dangerous.has(node.tagName))return document.createDocumentFragment();
  let wrapper=approved.has(node.tagName)?document.createElement(node.tagName.toLowerCase()):document.createDocumentFragment();
  for(const child of Array.from(node.childNodes))wrapper.appendChild(clean(child));
  return wrapper;
 }
 const output=document.createElement('div');for(const child of Array.from(doc.body.firstChild?.childNodes||[]))output.appendChild(clean(child));
 return output.innerHTML;
}

let cvMammothPromise;
function mammothForCV(){
 if(window.mammoth?.convertToHtml)return Promise.resolve(window.mammoth);
 if(cvMammothPromise)return cvMammothPromise;
 cvMammothPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/mammoth@1.9.1/mammoth.browser.min.js';script.async=true;
  script.onload=()=>window.mammoth?.convertToHtml?resolve(window.mammoth):reject(new Error('Libreria Word non disponibile'));
  script.onerror=()=>reject(new Error('Impossibile caricare il convertitore Word: controlla Internet o il blocco degli script'));
  document.head.appendChild(script);
 }).catch(e=>{cvMammothPromise=null;throw e});return cvMammothPromise;
}
async function importWordCV(file){
 if(!file)return;
 const status=document.getElementById('cv-status');
 if(!/\.docx$/i.test(file.name)){if(status)status.textContent='Formato non supportato. Salva il Word come .docx e riprova.';return;}
 if(file.size>6*1024*1024){if(status)status.textContent='Il file supera il limite di 6 MB.';return;}
 const editor=document.getElementById('cv-editor');if(!editor)return;
 if((editor.innerText||'').trim()&&!confirm('Sostituire la bozza attuale con il documento Word? Prima puoi esportarla.'))return;
 if(status)status.textContent='Importazione Word in corso…';
 try{
  const mammoth=await mammothForCV();const buffer=await file.arrayBuffer();const result=await mammoth.convertToHtml({arrayBuffer:buffer});
  const clean=sanitizeCVHtml(result.value||'');if(!clean.trim())throw Error('Il documento non contiene testo importabile.');
  editor.innerHTML=clean;data.cvFileName=file.name;saveCVText();
  if(status)status.textContent='✓ Word importato. Bozza modificabile salvata localmente.'+(result.messages?.length?' Alcune formattazioni potrebbero non essere state importate.':'');
 }catch(e){console.error('Word import',e);if(status)status.textContent='Importazione non riuscita: '+(e.message||String(e))+'. Puoi comunque incollare il testo del CV.';}
}

let manualRefreshActive=false;
function manualRefreshBanner(message,percentage,failed=0){
 let el=document.getElementById('refresh-all-progress');
 if(!el){el=document.createElement('div');el.id='refresh-all-progress';document.body.appendChild(el)}
 const value=Math.max(0,Math.min(100,Number(percentage)||0));
 el.innerHTML='<strong>↻ Aggiornamento completo delle fonti</strong><p>'+esc(message)+'</p><div class="manual-progress"><i style="width:'+value+'%"></i></div><small>'+value+'% completato'+(failed?' · '+failed+' fonti con errori':'')+'</small>';
}
async function startRefreshAll(){
 if(manualRefreshActive)return;
 if(!confirm('Vuoi controllare tutte le fonti Careers collegate? L’operazione potrebbe richiedere alcuni minuti. Tieni aperta questa scheda fino al completamento.'))return;
 manualRefreshActive=true;let failed=0,success=0;
 manualRefreshBanner('Avvio del controllo…',0);
 try{
  const call=async(path,body)=>{
   const r=await fetch(API_BASE+path,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),signal:AbortSignal.timeout(30000)});
   let x;try{x=await r.json()}catch{throw Error('Risposta non valida dal server')}
   if(!r.ok||!x.ok)throw Error(x.message||'Richiesta non riuscita');
   return x;
  };
  const session=await call('/api/refresh-all/start',{});
  manualRefreshBanner('Connessione stabilita. Inizio lettura dei feed…',Math.round(100*session.processed/session.total));
  let progress=session.processed||0;
  while(progress<session.total){
   const response=await call('/api/refresh-all/step',{runId:session.runId,token:session.token});
   progress=response.processed;
   if(response.success)success++;else failed++;
   manualRefreshBanner(response.source+': '+(response.success?'controllata · '+response.found+' offerte attive':'errore di importazione')+' · '+progress+'/'+session.total+' fonti',Math.round(100*progress/session.total),failed);
   if(response.done)break;
  }
  await loadLive();
  manualRefreshBanner('Terminato. '+success+' fonti importate in questa sessione'+(failed?' e '+failed+' non riuscite. Apri Stato fonti per verificare.':'.') ,100,failed);
 }catch(e){const message=String(e.message||e);const waiting=/già richiesto di recente|aggiornamento completo già richiesto|429/i.test(message);manualRefreshBanner(waiting?'Ultimo aggiornamento richiesto negli ultimi 30 minuti. Attendi prima di avviarne un altro; i risultati già importati restano disponibili.':'Controllo non completato: '+message+'. Gli aggiornamenti già riusciti restano salvati.',waiting?100:0,failed)}
 finally{manualRefreshActive=false}
}

// V36: every job batch is optional to overall API availability. Never discard good results
// because one of 20+ requests fails; retry transient failures, and resume where possible.
let liveLoadActive=false;
async function readCareerJSON(path,attempts=3){
 let last;
 for(let attempt=0;attempt<attempts;attempt++){
  try{
   const res=await fetch(API_BASE+path,{headers:{Accept:'application/json'},cache:'no-store',signal:AbortSignal.timeout(18000)});
   if(!res.ok){const ex=new Error('HTTP '+res.status+' in '+path.split('?')[0]);ex.permanent=res.status>=400&&res.status<500&&res.status!==429;throw ex;}
   const result=await res.json();
   if(result.ok!==true)throw Error('Risposta non valida da '+path.split('?')[0]);
   return result;
  }catch(e){last=e;if(e.permanent||attempt===attempts-1)break;await new Promise(resolve=>setTimeout(resolve,350*(attempt+1)));}
 }
 throw last||Error('Richiesta non riuscita');
}
// V46 — non-destructive synchronization of D1 company catalog. Local favorites and notes prevail.
let companyD1Sync={status:'pending',total:0,added:0};
async function syncCompanyCatalog(){
 try{
  const r=await fetch(API_BASE+'/api/companies',{headers:{Accept:'application/json'},cache:'no-store',signal:AbortSignal.timeout(16000)});
  if(!r.ok)throw Error('HTTP '+r.status);
  const body=await r.json();if(!body.ok||!Array.isArray(body.companies))throw Error('Formato non valido');
  const have=new Map(data.companies.map(c=>[nameKey(c.name),c]));
  const removed=new Set((data.removedCompanyNames||[]).map(nameKey));
  let added=0,linked=0;
  for(const row of body.companies){
   const name=String(row.name||'').trim().slice(0,150),key=nameKey(name);
   if(!name||removed.has(key))continue;
   const local=have.get(key);
   if(local){
    // Server owns monitoring status, but never overwrite local notes, favorites or edited fields.
    if(row.monitoring_status)local.monitoring=row.monitoring_status;
    if(!local.careers_url&&row.careers_url)local.careers_url=row.careers_url;
    if(!local.url&&row.website_url)local.url=row.website_url;
    if(!local.location&&row.location)local.location=row.location;
    if(!local.sector&&row.sector)local.sector=row.sector;
    linked++;
   }else{
    const c={id:'d1-'+row.id,name,sector:row.sector||'Da classificare',location:row.location||'',
      url:row.website_url||'',careers_url:row.careers_url||'',favorite:false,notes:'',
      monitoring:row.monitoring_status||'not_configured'};
    data.companies.push(c);have.set(key,c);added++;
   }
  }
  companyD1Sync={status:'ready',total:body.companies.length,added};
  try{save()}catch(e){console.warn('Company catalog sync not saved locally',String(e));}
  if(view==='companies'||view==='dashboard')render();
 }catch(e){companyD1Sync={status:'unavailable',total:0,added:0};console.warn('D1 company catalog unavailable; local watchlist preserved',String(e));}
}
async function loadLive(){
 if(liveLoadActive)return;
 liveLoadActive=true;
 const previous={...live,jobs:[...live.jobs]};
 live.state=previous.jobs.length?'ready':'loading';live.error='';live.loadWarning='';render();
 try{
  const status=await readCareerJSON('/api/status');
  const total=Math.max(0,Number(status.jobs)||0);
  // Reuse already-loaded pages on a retry when the total has not changed.
  let imported=(previous.state==='partial'&&previous.totalJobs===total)?[...previous.jobs]:[];
  let offset=imported.length;
  let issue='';
  live={...live,state:imported.length?'partial':'loading',companies:status.companies||0,totalJobs:total,lastRefresh:status.last_refresh};
  while(offset<Math.min(Math.max(total,200),10000)){
   try{
    const body=await readCareerJSON('/api/jobs?compact=1&limit=200&offset='+offset);
    if(!Array.isArray(body.jobs))throw Error('Elenco offerte non valido');
    if(!body.jobs.length)break;
    imported.push(...body.jobs);
    offset+=body.jobs.length;
    if(body.jobs.length<200)break;
   }catch(e){issue='Una richiesta dell’elenco offerte non è riuscita ('+String(e.message||e)+').';break;}
  }
  let coverage=previous.coverage||[];
  try{const result=await readCareerJSON('/api/coverage',1);if(Array.isArray(result.sources))coverage=result.sources;}
  catch(e){console.warn('Coverage non disponibile; dati precedenti conservati',e)}
  live={state:issue?'partial':'ready',jobs:imported.length?imported:previous.jobs,companies:status.companies||0,
   totalJobs:total,coverage,error:'',loadWarning:issue?'Caricati '+imported.length+' annunci. '+issue+' Premi Aggiorna vista per riprendere.':'',
   lastRefresh:status.last_refresh,updatedAt:new Date().toISOString()};
 }catch(e){
  console.warn('Career Radar: stato API temporaneamente non disponibile',e);
  if(previous.jobs.length){live={...previous,state:'partial',error:'',loadWarning:'Connessione temporaneamente instabile; annunci precedentemente caricati conservati. Premi Aggiorna vista.'};}
  else{live={...previous,state:'error',error:String(e.message||e),loadWarning:''};}
 }finally{liveLoadActive=false;render();}
}
